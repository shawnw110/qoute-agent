name: Post quote

on:
  schedule:
    # Times are in UTC. These equal 8am, 1pm and 7pm Eastern (standard time).
    # GitHub can run scheduled jobs a few minutes late, that's normal.
    - cron: "7 13 * * *"   # 8:07am ET
    - cron: "7 18 * * *"   # 1:07pm ET
    - cron: "7 0 * * *"    # 7:07pm ET
  workflow_dispatch:        # lets you press "Run workflow" to post right now

permissions:
  contents: write           # lets the agent save images to the repo

concurrency:
  group: post-quote
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install emoji font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make slides and post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python post.py
